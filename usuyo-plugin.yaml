# 抖音获取插件：按一条分享链接取单个作品（视频、图文），不用账号；喜欢、收藏由你浏览器里的脚本交来。
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 7 节一一对应
# （client-hook 那行在另一个组织，不列）。
# share-page 读分享页里的数据，2026-11-12 量到分享页不再带作品数据，见 src/page.rs 顶部；
# h5-token 照 H5 页自己的做法，用分享页算出的令牌调 iteminfo，见 src/h5.rs 顶部（private-api，默认关）。
# ddr-import 读 DouyinDataReview「导出数据」存的 JSON，只列链接、不联网，见 src/ddr.rs 顶部。
protocol: 1
id: usuyo-fetch/douyin
kind: fetch
name: 抖音
description: 按分享链接取单个作品的文字、作者、计数、音乐、封面、图片和视频（不用账号，两种方法）；喜欢和收藏由你浏览器里的脚本交来
version: 0.1.0
license: MIT
maintainers: [Fldicoahkiin]
upstream:
  - name: parse-video（抖音分享页的解析）
    url: https://github.com/wujunwei928/parse-video
    license: MIT
  - name: parse-video PR #106（H5 页的令牌）
    url: https://github.com/wujunwei928/parse-video/pull/106
    license: MIT
  - name: ParseHub（字段名）
    url: https://github.com/z-mio/ParseHub
    license: MIT
platforms: [douyin]
match:
  - "v.douyin.com/*"
  - "www.douyin.com/video/*"
  - "www.douyin.com/note/*"
  - "www.iesdouyin.com/share/video/*"
methods:
  - id: share-page
    name: 分享页
    access: public-web
    login: none
    account: none
    risk:
      text: 2026-08-08 起分享页不再内嵌作品数据，这种方法取不到（2026-11-12 实测同样）
      source: {label: "parse-video #98", url: "https://github.com/wujunwei928/parse-video/issues/98"}
    capabilities:
      fetch:
        timeout: 30m
        outputs: [text, images, media:video, meta]
  - id: h5-token
    name: H5 页的令牌
    access: private-api
    login: none
    account: none
    risk:
      text: 带的参数是分享页算出来的一次性令牌，加密方式由平台定，改了就失效；没有账号相关的报告
      source: {label: "parse-video PR #106", url: "https://github.com/wujunwei928/parse-video/pull/106"}
    capabilities:
      fetch:
        timeout: 30m
        outputs: [text, images, media:video, meta]
  - id: export
    name: 个人信息下载（喜欢、收藏）
    built: false
    access: official-export
    login: none
    account: none
    capabilities:
      list:
        sources:
          - {source: "douyin:likes", title: 喜欢, action: like}
          - {source: "douyin:favorites", title: 收藏, action: favorite}
  - id: userscript
    name: 浏览器脚本（喜欢、收藏）
    access: browser-session
    login: required
    account: own-browser
    delivers: links
    script: userscript/usuyo-douyin-saved.user.js
    risk:
      text: 限制多是几小时，没有封号报告；这个脚本还没在真浏览器里跑过
      source: {label: "调研 06 §16.2", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#162-issue-里的账号问题"}
  - id: ddr-import
    name: DouyinDataReview 的导出（喜欢、收藏、观看历史）
    access: official-export
    login: none
    account: none
    risk:
      text: 清单由 DouyinDataReview 用你的登录会话发签名请求取得，取清单那一步在它里面；这种方法只读你交来的导出文件，不向任何平台发请求
      source: {label: DouyinDataReview, url: "https://github.com/ZhangYukwiver/DouyinDataReview"}
    capabilities:
      list:
        order: unordered
        files: ["抖音数据_*.json"]
        reads: DouyinDataReview 在「设置 → 数据」里「导出数据」存下的 JSON，里面的观看历史、喜欢、收藏；清单由 DouyinDataReview 用你的登录会话发签名请求取得
  - id: iphone
    name: iPhone 镜像
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: iphone
    capabilities:
      list:
        sources:
          - {source: "douyin:likes", title: 喜欢, action: like}
          - {source: "douyin:favorites", title: 收藏, action: favorite}
  - id: android
    name: 安卓手机
    built: false
    access: vision-ui
    login: required
    account: own-phone
    interaction: foreground
    drives: android
    capabilities:
      list:
        sources:
          - {source: "douyin:likes", title: 喜欢, action: like}
          - {source: "douyin:favorites", title: 收藏, action: favorite}
  - id: mediacrawler
    name: MediaCrawler 的结果文件
    access: private-api
    login: none
    account: none
    risk:
      text: 文件是你自己用登录了你账号的 MediaCrawler 跑出来的；这种方法只读你交来的文件，不向任何平台发请求。记录到的封禁在 MediaCrawler 采集的那一侧（它的 issue 里有小红书账号被永久封禁的报告）
      source: {label: "MediaCrawler #865", url: "https://github.com/NanmiCoder/MediaCrawler/issues/865"}
    capabilities:
      list:
        order: unordered
        files: ["*.json", "*.jsonl", "*.zip"]
        reads: MediaCrawler 保存成 json 或 jsonl 的抖音帖子文件（名字里带 contents；评论文件、CSV、SQLite 不读），或把 data 文件夹压成的 zip
pacing:
  douyin: {batch: true, interval: 8s, daily: 300}
permissions:
  fs:
    read: ["${INPUT}"]
    write: ["${OUT}"]
  network:
    mode: allowlist
    hosts:
      - "v.douyin.com"
      - "www.iesdouyin.com"
      - "*.snssdk.com"
      - "*.douyinvod.com"
      - "*.douyinpic.com"
      - "*.zjcdn.com"
      - "*.byteimg.com"
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-douyin"]
